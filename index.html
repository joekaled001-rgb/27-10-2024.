<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Aniversario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF7F2; color: #0F2B48; }
        .serif-title { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            const [isAuthenticated, setIsAuthenticated] = React.useState(false);
            const [pinInput, setPinInput] = React.useState('');
            const [savedPin, setSavedPin] = React.useState(() => localStorage.getItem('anniversary_pin') || '');
            const [pinError, setPinError] = React.useState('');
            const [currentUser, setCurrentUser] = React.useState('Él');
            const [activeTab, setActiveTab] = React.useState('home');
            
            // Datos iniciales de prueba
            const [letters, setLetters] = React.useState([
                { id: 1, title: 'Para el amor de mi vida', content: 'Feliz aniversario. Este espacio digital está hecho para guardar cada palabra y cada recuerdo...', author: 'Él', date: '25 de octubre de 2026' }
            ]);
            const [albumItems, setAlbumItems] = React.useState([
                { id: 1, url: 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=800&auto=format&fit=crop', caption: 'Un momento especial inolvidable', author: 'Él', type: 'image', date: '2026-10-25' }
            ]);
            const [calendarEntries, setCalendarEntries] = React.useState({
                '2026-10-27': { note: 'Nuestro Aniversario Oficial', photo: 'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=600&auto=format&fit=crop', photoCaption: 'Celebrando nuestro día' }
            });

            // Estados de modales y formularios
            const [showLetterModal, setShowLetterModal] = React.useState(false);
            const [newLetterTitle, setNewLetterTitle] = React.useState('');
            const [newLetterContent, setNewLetterContent] = React.useState('');
            const [showAlbumModal, setShowAlbumModal] = React.useState(false);
            const [newMediaUrl, setNewMediaUrl] = React.useState('');
            const [newMediaCaption, setNewMediaCaption] = React.useState('');
            const [newMediaType, setNewMediaType] = React.useState('image');
            const [showCalendarModal, setShowCalendarModal] = React.useState(false);
            const [selectedDate, setSelectedDate] = React.useState(new Date());
            const [calendarNote, setCalendarNote] = React.useState('');
            const [calendarPhotoUrl, setCalendarPhotoUrl] = React.useState('');
            const [calendarPhotoCaption, setCalendarPhotoCaption] = React.useState('');
            const [currentCalendarMonth, setCurrentCalendarMonth] = React.useState(new Date());

            // Contador de aniversario
            const anniversaryDate = new Date(2024, 9, 27); // 27 de octubre de 2024
            const now = new Date();
            let years = now.getFullYear() - anniversaryDate.getFullYear();
            let months = now.getMonth() - anniversaryDate.getMonth();
            let days = now.getDate() - anniversaryDate.getDate();
            if (days < 0) { months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
            if (months < 0) { years--; months += 12; }

            const handlePinSubmit = (e) => {
                e.preventDefault();
                if (!savedPin) {
                    if (pinInput.length < 4) { setPinError('El PIN debe tener al menos 4 dígitos'); return; }
                    localStorage.setItem('anniversary_pin', pinInput);
                    setSavedPin(pinInput);
                    setIsAuthenticated(true);
                } else if (pinInput === savedPin) {
                    setIsAuthenticated(true);
                } else {
                    setPinError('PIN incorrecto. Inténtalo de nuevo.');
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#FAF7F2] p-4">
                        <div className="max-w-md w-full bg-[#F4EFE6] p-8 rounded-3xl shadow-xl border border-[#0F2B48]/10 text-center">
                            <span className="text-3xl mb-3 inline-block">🔒</span>
                            <h2 className="serif-title text-3xl font-bold text-[#0F2B48] mb-2">
                                {savedPin ? 'Espacio Privado' : 'Crear Clave Secreta'}
                            </h2>
                            <p className="text-sm text-[#0F2B48]/70 mb-6">
                                {savedPin ? 'Ingresa tu PIN de 4 dígitos para acceder a sus recuerdos.' : 'Protege este espacio creando una contraseña compartida.'}
                            </p>
                            <form onSubmit={handlePinSubmit} className="space-y-4">
                                <input 
                                    type="password" maxLength="4" placeholder="••••"
                                    value={pinInput} onChange={(e) => setPinInput(e.target.value)}
                                    className="w-full text-center text-3xl tracking-widest py-3 rounded-2xl bg-white border border-[#0F2B48]/20 focus:outline-none focus:ring-2 focus:ring-[#0F2B48]"
                                />
                                {pinError && <p className="text-red-600 text-xs">{pinError}</p>}
                                <button type="submit" className="w-full py-3 bg-[#0F2B48] text-white rounded-2xl font-semibold hover:bg-[#0F2B48]/90 transition">
                                    {savedPin ? 'Entrar al espacio' : 'Guardar y Entrar'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#FAF7F2] text-[#0F2B48] pb-12">
                    {/* Barra superior de usuario y navegación */}
                    <header className="border-b border-[#0F2B48]/10 bg-[#FAF7F2]/80 backdrop-blur sticky top-0 z-40 px-6 py-4 flex justify-between items-center max-w-5xl mx-auto">
                        <div className="flex items-center space-x-2">
                            <span className="serif-title text-xl font-bold">Nuestro Aniversario</span>
                        </div>
                        <div className="flex items-center space-x-4">
                            <div className="flex bg-[#F4EFE6] p-1 rounded-full border border-[#0F2B48]/1">
                                <button onClick={() => setCurrentUser('Él')} className={`px-3 py-1 rounded-full text-xs font-semibold transition ${currentUser === 'Él' ? 'bg-[#0F2B48] text-white' : 'text-[#0F2B48]'}`}>Él</button>
                                <button onClick={() => setCurrentUser('Ella')} className={`px-3 py-1 rounded-full text-xs font-semibold transition ${currentUser === 'Ella' ? 'bg-[#0F2B48] text-white' : 'text-[#0F2B48]'}`}>Ella</button>
                            </div>
                            <button onClick={() => setIsAuthenticated(false)} className="text-xs text-[#0F2B48]/70 hover:text-[#0F2B48]">Bloquear 🔒</button>
                        </div>
                    </header>

                    {/* Contenido Principal */}
                    <main className="max-w-4xl mx-auto px-4 pt-8 space-y-10">
                        <div className="space-y-2">
                            <p className="text-xs uppercase tracking-widest text-[#0F2B48]/60 font-semibold">Un lugar para nosotros</p>
                            <h1 className="serif-title text-4xl md:text-5xl font-bold">Una historia que seguimos escribiendo.</h1>
                            <p className="text-[#0F2B48]/70 text-sm md:text-base">Un lugar para guardar lo que compartimos: palabras, fotos y esos días que se vuelven inolvidables.</p>
                        </div>

                        {/* Bloque de Aniversario / Contador */}
                        <div className="bg-[#0F2B48] text-[#FAF7F2] p-8 rounded-3xl shadow-lg relative overflow-hidden">
                            <p className="text-xs uppercase tracking-widest opacity-80 mb-1">Desde el primer día</p>
                            <h2 className="serif-title text-2xl md:text-3xl font-bold mb-4">27 de octubre de 2024</h2>
                            <div className="flex space-x-4 text-sm font-medium opacity-90">
                                <span>{years} años</span> • <span>{months} meses</span> • <span>{days} días</span>
                            </div>
                        </div>

                        {/* Sección de Cartas */}
                        <section className="bg-[#F4EFE6] p-6 md:p-8 rounded-3xl border border-[#0F2B48]/10 space-y-6">
                            <div className="flex justify-between items-center">
                                <div>
                                    <p className="text-xs uppercase tracking-widest text-[#0F2B48]/60 font-semibold">Palabras que quedan</p>
                                    <h3 className="serif-title text-2xl font-bold">Cartas</h3>
                                </div>
                                <button onClick={() => setShowLetterModal(true)} className="px-4 py-2 bg-[#0F2B48] text-white text-sm rounded-xl font-medium hover:bg-[#0F2B48]/90 transition">
                                    + Escribir una carta
                                </button>
                            </div>
                            <div className="space-y-4">
                                {letters.map((l) => (
                                    <div key={l.id} className="bg-white/80 p-5 rounded-2xl border border-[#0F2B48]/10 space-y-2">
                                        <div className="flex justify-between items-start">
                                            <h4 className="serif-title text-xl font-bold">{l.title}</h4>
                                            <span className="text-xs text-[#0F2B48]/60">{l.date}</span>
                                        </div>
                                        <p className="text-sm text-[#0F2B48]/80 leading-relaxed">{l.content}</p>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Sección de Álbum */}
                        <section className="bg-[#F4EFE6] p-6 md:p-8 rounded-3xl border border-[#0F2B48]/10 space-y-6">
                            <div className="flex justify-between items-center">
                                <div>
                                    <p className="text-xs uppercase tracking-widest text-[#0F2B48]/60 font-semibold">Instantes que vuelven (tenemos que empezar a tomarnos fotos)</p>
                                    <h3 className="serif-title text-2xl font-bold">Álbum</h3>
                                </div>
                                <button onClick={() => setShowAlbumModal(true)} className="px-4 py-2 bg-[#0F2B48] text-white text-sm rounded-xl font-medium">
                                    + Sumar una foto
                                </button>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                {albumItems.map((item) => (
                                    <div key={item.id} className="bg-white p-3 rounded-2xl shadow-sm border border-[#0F2B48]/10 space-y-2">
                                        <img src={item.url} alt="Recuerdo" className="w-full h-48 object-cover rounded-xl" />
                                        <p className="text-xs text-[#0F2B48]/80 font-medium">{item.caption}</p>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </main>

                    {/* Modales sencillos */}
                    {showLetterModal && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-[#FAF7F2] p-6 rounded-3xl max-w-md w-full space-y-4">
                                <h3 className="serif-title text-2xl font-bold">Escribir carta</h3>
                                <input type="text" placeholder="Título" id="lTitle" className="w-full p-3 rounded-xl bg-white border border-[#0F2B48]/20" />
                                <textarea placeholder="Escribe tu mensaje aquí..." id="lContent" rows="4" className="w-full p-3 rounded-xl bg-white border border-[#0F2B48]/20"></textarea>
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setShowLetterModal(false)} className="px-4 py-2 text-sm text-[#0F2B48]">Cancelar</button>
                                    <button onClick={() => {
                                        const t = document.getElementById('lTitle').value;
                                        const c = document.getElementById('lContent').value;
                                        if(t && c) {
                                            setLetters([{id: Date.now(), title: t, content: c, author: currentUser, date: new Date().toLocaleDateString()}, ...letters]);
                                            setShowLetterModal(false);
                                        }
                                    }} className="px-4 py-2 bg-[#0F2B48] text-white text-sm rounded-xl">Guardar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAlbumModal && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-[#FAF7F2] p-6 rounded-3xl max-w-md w-full space-y-4">
                                <h3 className="serif-title text-2xl font-bold">Subir foto al álbum</h3>
                                <input type="text" placeholder="Enlace de la imagen (URL)" id="aUrl" className="w-full p-3 rounded-xl bg-white border border-[#0F2B48]/20" />
                                <input type="text" placeholder="Descripción breve" id="aCap" className="w-full p-3 rounded-xl bg-white border border-[#0F2B48]/20" />
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setShowAlbumModal(false)} className="px-4 py-2 text-sm text-[#0F2B48]">Cancelar</button>
                                    <button onClick={() => {
                                        const u = document.getElementById('aUrl').value;
                                        const cp = document.getElementById('aCap').value;
                                        if(u) {
                                            setAlbumItems([{id: Date.now(), url: u, caption: cp || 'Un gran recuerdo', author: currentUser}, ...albumItems]);
                                            setShowAlbumModal(false);
                                        }
                                    }} className="px-4 py-2 bg-[#0F2B48] text-white text-sm rounded-xl">Añadir</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
